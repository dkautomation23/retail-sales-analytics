name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: retail
          POSTGRES_PASSWORD: retail
          POSTGRES_DB: retail
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U retail -d retail"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests (no database)
        run: python -m pytest -q tests/test_clean.py
      - name: Download and verify the dataset
        run: python scripts/download_data.py
      - name: Load the warehouse
        run: python -m analytics.etl
      - name: Data-quality checks
        run: python -m analytics.quality
      - name: All tests on the loaded warehouse
        run: python -m pytest -q
      - name: Findings
        run: python -m analytics.findings
      - name: Build the dashboard
        run: python -m analytics.dashboard
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dashboard
          path: docs/index.html
